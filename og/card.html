<!doctype html>
<!-- Source for og-image.png (1200x630). Regenerate with a 1200x630 screenshot of this file. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#FFFFFF;color:#1F2124;font-family:"Anek Latin",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
  .wrap{position:absolute;left:76px;top:70px;width:640px}
  .wordmark{font-family:Michroma,sans-serif;font-size:34px;letter-spacing:.18em;color:#0E0E0E}
  .kicker{margin:62px 0 18px;color:#5018DB;font-weight:600;font-size:25px;letter-spacing:.08em;text-transform:uppercase}
  h1{margin:0;font:400 50px/1.25 Michroma,sans-serif;color:#0E0E0E}
  p{margin:22px 0 0;color:#4F5660;font-size:30px;line-height:1.3}
  .pills{position:absolute;left:76px;bottom:62px;display:flex;gap:14px}
  .pill{padding:13px 26px 11px;border-radius:8px;background:#0E0E0E;color:#fff;font-size:24px;font-weight:600}
  .pill.v{background:#5018DB}
  .panel{position:absolute;right:0;top:0;width:400px;height:630px;background:#EAE8E4}
  .phone{position:absolute;right:62px;top:58px;width:300px;height:620px;border-radius:46px;background:#0E0E0E;padding:14px;box-shadow:0 30px 70px rgba(14,14,14,.28)}
  .screen{height:100%;border-radius:34px;background:#1F1D1E;color:#fff;padding:34px 22px;position:relative;overflow:hidden}
  .notch{position:absolute;left:50%;top:12px;width:96px;height:26px;margin-left:-48px;border-radius:14px;background:#0E0E0E}
  .app{font-weight:600;font-size:22px;margin-top:22px}
  .bal{font-weight:700;font-size:46px;text-align:center;margin:30px 0 4px;letter-spacing:-.01em}
  .fiat{text-align:center;color:#B4AFA8;font-size:18px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:30px}
  .tile{height:74px;border-radius:14px;background:#2E2B2C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:#E6E2DC}
  .tile i{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:block}
  .tile.on{background:#5018DB;color:#fff;box-shadow:0 0 0 3px rgba(80,24,219,.35)}
  .banner{margin-top:26px;border-radius:14px;background:#5018DB;padding:16px;font-size:17px;font-weight:600;line-height:1.3}
  .act{margin-top:26px;font-size:18px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px;border-radius:14px;background:#2E2B2C;font-size:16px}
  .row span small{display:block;color:#B4AFA8;font-weight:400;font-size:14px}
  .row b{color:#fff;font-weight:600}
  .banner small{display:block;font-weight:400;opacity:.85;font-size:15px}
</style></head><body>
  <div class="panel"></div>
  <div class="wrap">
    <div class="wordmark">ZODL</div>
    <div class="kicker">Your friend shared Zodl with you</div>
    <h1>Private money,<br>on your phone.</h1>
    <p>The free Zcash wallet. Receive<br>your first ZEC today.</p>
  </div>
  <div class="pills"><div class="pill v">App Store</div><div class="pill">Google Play</div></div>
  <div class="phone"><div class="screen"><div class="notch"></div>
    <div class="app">Zodl</div>
    <div class="bal">0.25 ZEC</div><div class="fiat">Your first ZEC</div>
    <div class="tiles"><div class="tile on"><i></i>Receive</div><div class="tile"><i></i>Send</div><div class="tile"><i></i>Pay</div><div class="tile"><i></i>Swap</div></div>
    <div class="banner">Payment received<small>From your friend</small></div>
    <div class="act">Activity</div>
    <div class="row"><span>Received<small>Just now</small></span><b>+0.25 ZEC</b></div>
  </div></div>
</body></html>
